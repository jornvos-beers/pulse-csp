<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--v50:#f5f3ff;--v100:#ede9fe;--v200:#ddd6fe;--v500:#8b5cf6;--v600:#7c3aed;--v700:#6d28d9;--v900:#4c1d95;--s50:#f8fafc;--s100:#f1f5f9;--s200:#e2e8f0;--s300:#cbd5e1;--s400:#94a3b8;--s500:#64748b;--s600:#475569;--s700:#334155;--s800:#1e293b;--s900:#0f172a;--emerald:#10b981;--amber:#f59e0b;--rose:#ef4444;--cyan:#06b6d4;--orange:#f97316;--pink:#ec4899}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--s50);color:var(--s900);display:flex;height:100vh;overflow:hidden}
/* Sidebar */
.sidebar{width:224px;min-width:224px;background:var(--s900);color:#fff;display:flex;flex-direction:column;height:100vh}
.sidebar-logo{padding:24px 20px;display:flex;align-items:center;gap:10px}
.sidebar-logo .icon{width:32px;height:32px;border-radius:8px;background:var(--v500);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.sidebar-logo span{font-size:18px;font-weight:700;letter-spacing:-.5px}
.sidebar nav{flex:1;padding:0 12px;margin-top:8px}
.sidebar nav button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;border:none;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:4px;color:var(--s400);background:transparent;text-align:left}
.sidebar nav button:hover{background:var(--s800)}
.sidebar nav button.active{background:var(--v600);color:#fff}
.sidebar-source{margin:0 12px 12px;padding:12px 16px;border-radius:8px;background:rgba(16,185,129,.1)}
.sidebar-source .label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--emerald)}
.sidebar-source .sub{font-size:11px;color:var(--s500);margin-top:2px;margin-left:18px}
.sidebar-user{padding:16px 20px;border-top:1px solid var(--s800);display:flex;align-items:center;gap:12px}
.sidebar-user .avatar{width:32px;height:32px;border-radius:50%;background:var(--v500);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.sidebar-user .name{font-size:13px;font-weight:500}
.sidebar-user .role{font-size:11px;color:var(--s500)}
/* Main */
.main{flex:1;overflow-y:auto;padding:32px}
.main-inner{max-width:1140px;margin:0 auto}
/* Cards */
.card{background:#fff;border:1px solid var(--s200);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi{padding:20px}.kpi .label{font-size:12px;color:var(--s500);font-weight:500;margin-bottom:4px}
.kpi .value{font-size:28px;font-weight:700}.kpi .sub{font-size:12px;color:var(--s400);margin-top:2px}
/* Filters */
.filters{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.filters .seg{padding:6px 14px;border-radius:8px;border:1px solid var(--s200);font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:var(--s600);transition:all .15s}
.filters .seg.active{background:var(--v600);color:#fff;border-color:var(--v600)}
.filters .seg:hover:not(.active){border-color:var(--v200)}
/* Header */
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.page-header h1{font-size:22px;font-weight:700}.page-header .sub{font-size:13px;color:var(--s500);margin-top:2px}
select{font-size:13px;border:1px solid var(--s200);border-radius:8px;padding:8px 12px;background:#fff;outline:none}
select:focus{border-color:var(--v500);box-shadow:0 0 0 2px var(--v100)}
/* Table */
.acct-table{width:100%;border-collapse:collapse}
.acct-table th{text-align:left;font-size:11px;font-weight:600;color:var(--s400);text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;border-bottom:1px solid var(--s200)}
.acct-table td{padding:12px;border-bottom:1px solid var(--s100);font-size:13px;vertical-align:middle}
.acct-table tr:hover td{background:var(--s50)}
.acct-table tr{cursor:pointer}
.acct-ini{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.acct-name{font-weight:600;color:var(--s900)}
.acct-ind{font-size:11px;color:var(--s500)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600}
.badge.healthy{background:#ecfdf5;color:var(--emerald);border:1px solid #d1fae5}
.badge.monitor{background:#fffbeb;color:var(--amber);border:1px solid #fef3c7}
.badge.at-risk{background:#fef2f2;color:var(--rose);border:1px solid #fecaca}
.badge-dot{width:6px;height:6px;border-radius:50%}
.badge.healthy .badge-dot{background:var(--emerald)}.badge.monitor .badge-dot{background:var(--amber)}.badge.at-risk .badge-dot{background:var(--rose)}
.signal-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;margin-right:4px}
.hs-num{font-weight:700;font-size:14px}
.hs-delta{font-size:11px;margin-left:4px}
.hs-delta.up{color:var(--emerald)}.hs-delta.down{color:var(--rose)}
/* Planhat banner */
.ph-banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;border:1px solid #d1fae5;background:rgba(16,185,129,.04);margin-bottom:24px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.ph-banner .icon{width:32px;height:32px;border-radius:8px;background:rgba(16,185,129,.1);color:var(--emerald);display:flex;align-items:center;justify-content:center;font-size:16px}
.ph-banner .live{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:#ecfdf5;color:#047857;border:1px solid #d1fae5}
.ph-banner .live .dot{width:6px;height:6px;border-radius:50%;background:var(--emerald)}
/* Detail */
.detail-header{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.back-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--s200);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.back-btn:hover{border-color:var(--v200);background:var(--v50)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.health-ring-wrap{display:flex;align-items:center;justify-content:center}
/* AI */
.ai-btn{padding:10px 20px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;background:var(--v600);color:#fff;width:100%}
.ai-btn:hover{background:var(--v700)}
.ai-btn:disabled{opacity:.6;cursor:wait}
.ai-output{font-size:13px;line-height:1.7;color:var(--s700);white-space:pre-wrap;border-top:1px solid var(--s100);padding-top:16px;margin-top:16px}
/* Health Model */
.hm-callout{background:var(--v50);border:1px solid var(--v200);border-radius:12px;padding:24px;margin-bottom:24px}
.hm-callout h3{font-size:14px;font-weight:700;color:var(--v900);margin-bottom:6px}
.hm-callout p{font-size:13px;color:#5b21b6;line-height:1.6}
.weight-bar{height:10px;border-radius:5px;background:var(--s100);overflow:hidden;margin-top:4px}
.weight-fill{height:100%;border-radius:5px}
.threshold-row{display:flex;gap:12px;margin-bottom:24px}
.threshold{flex:1;padding:16px;border-radius:8px;border:1px solid}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border:2px solid var(--v200);border-top-color:var(--v600);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
</style>
</head>

    <div class="kpi-row">
      <div class="card kpi"><div class="label">Total ARR</div><div class="value">${fmt(totalArr)}</div></div>
      <div class="card kpi"><div class="label">Avg Health</div><div class="value" style="color:${avgH>=70?"var(--emerald)":avgH>=40?"var(--amber)":"var(--rose)"}">${avgH}</div></div>
      <div class="card kpi"><div class="label">At Risk</div><div class="value" style="color:var(--rose)">${risk}</div></div>
      <div class="card kpi"><div class="label">Accounts</div><div class="value">${pool.length}</div><div class="sub">${pool.filter(c=>c.st==="customer").length} customers · ${pool.filter(c=>c.st==="prospect").length} prospects</div></div>
    </div>
    <div class="filters">${segs.map(s=>`<button class="seg ${state.segment===s.id?"active":""}" onclick="state.segment='${s.id}';render()">${s.l}</button>`).join("")}</div>
    <div class="card" style="padding:0;overflow:hidden">
      <table class="acct-table">
        <thead><tr><th>Account</th><th>Health</th><th>ARR</th><th>Tier</th><th>Phase</th><th>CSM</th><th>Signals</th><th>Renewal</th></tr></thead>
        <tbody>${filtered.sort((a,b)=>a.hs-b.hs).map(c=>{
          const st=status(c.hs);const delta=c.hs-c.prev;
          const sigs=c.sig.map(s=>{const cfg=SIG[s]||{label:s,color:"#94a3b8"};return`<span class="signal-tag" style="background:${cfg.color}18;color:${cfg.color}">${cfg.label}</span>`;}).join("");
          return`<tr onclick="selectAcct(${c.id})">
            <td><div style="display:flex;align-items:center;gap:10px"><div class="acct-ini" style="background:${c.col}">${c.n.split(/\s+/).map(w=>w[0]).join("").slice(0,2)}</div><div><div class="acct-name">${esc(c.n)}</div></div></div></td>
            <td><span class="hs-num" style="color:${st==="healthy"?"var(--emerald)":st==="monitor"?"var(--amber)":"var(--rose)"}">${c.hs}</span><span class="hs-delta ${delta>0?"up":"down"}">${delta>0?"▲":"▼"}${Math.abs(delta)}</span></td>
            <td>${fmt(c.arr)}</td>
            <td><span class="badge ${st}"><span class="badge-dot"></span>${c.tier}</span></td>
            <td style="font-size:12px;color:var(--s500)">${c.ph}</td>
            <td style="font-size:12px">${esc(c.csm)}</td>
            <td>${sigs||"—"}</td>
            <td style="font-size:12px;color:var(--s500)">${c.ren||"—"}</td>
          </tr>`;}).join("")}</tbody>
      </table>
    </div>`;
}

/* ═══ DETAIL ═══ */
function renderDetail(el){
  const c=state.companies.find(x=>x.id===state.selectedId);
  if(!c){nav("dashboard");return;}
  const st=status(c.hs);const delta=c.hs-c.prev;
  const hbLabels=["Usage","Engagement","Support","Sentiment","Momentum"];
  const hbKeys=["U","E","Su","Se","M"];
  const hbVals=hbKeys.map(k=>c.hb[k]);
  const trendData=[{m:"Jan",s:Math.max(0,c.hs-10)},{m:"Feb",s:Math.max(0,c.hs-7)},{m:"Mar",s:Math.max(0,c.hs-4)},{m:"Apr",s:Math.max(0,c.hs-2)},{m:"May",s:Math.max(0,c.hs-1)},{m:"Jun",s:c.hs}];

  el.innerHTML=`
    <div class="detail-header">
      <button class="back-btn" onclick="nav('dashboard')">←</button>
      <div class="acct-ini" style="background:${c.col};width:44px;height:44px;font-size:16px">${c.n.split(/\s+/).map(w=>w[0]).join("").slice(0,2)}</div>
      <div>
        <div style="display:flex;align-items:center;gap:8px"><h1 style="font-size:22px;font-weight:700">${esc(c.n)}</h1><span class="badge ${st}"><span class="badge-dot"></span>${st.replace("-"," ")}</span></div>
        <div style="font-size:13px;color:var(--s500);margin-top:2px">${c.tier} · ${c.ph} · ${esc(c.csm)}</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px">
      <div class="card kpi"><div class="label">Health</div><div class="value" style="font-size:24px;color:${st==="healthy"?"var(--emerald)":st==="monitor"?"var(--amber)":"var(--rose)"}">${c.hs}<span class="hs-delta ${delta>0?"up":"down"}" style="font-size:12px">${delta>0?"▲":"▼"}${Math.abs(delta)}</span></div></div>
      <div class="card kpi"><div class="label">ARR</div><div class="value" style="font-size:24px">${fmt(c.arr)}</div></div>
      <div class="card kpi"><div class="label">CSM Score</div><div class="value" style="font-size:24px">${c.cs}/5</div></div>
      <div class="card kpi"><div class="label">Renewal</div><div class="value" style="font-size:18px">${c.ren||"—"}</div><div class="sub">${c.rd?c.rd+" days":""}</div></div>
      <div class="card kpi"><div class="label">Signals</div><div style="margin-top:6px">${c.sig.map(s=>{const cfg=SIG[s]||{label:s,color:"#94a3b8"};return`<span class="signal-tag" style="background:${cfg.color}18;color:${cfg.color};margin-bottom:4px">${cfg.label}</span>`;}).join("")||"<span style='color:var(--s400);font-size:12px'>None</span>"}</div></div>
    </div>
    <div class="detail-grid">
      <div class="card"><h3 style="font-size:14px;font-weight:600;margin-bottom:16px">Health Breakdown</h3><canvas id="radarChart" height="220"></canvas></div>
      <div class="card"><h3 style="font-size:14px;font-weight:600;margin-bottom:16px">Health Trend</h3><canvas id="trendChart" height="220"></canvas></div>
    </div>
    <div class="card" style="margin-top:20px">
      <h3 style="font-size:14px;font-weight:600;margin-bottom:12px">AI Account Summary</h3>
      <button class="ai-btn" id="aiSumBtn" onclick="genSummary(${c.id})">Generate Summary</button>
      <div id="aiSumOut"></div>
    </div>`;

  // Radar
  new Chart(document.getElementById("radarChart"),{type:"radar",data:{labels:hbLabels,datasets:[{data:hbVals,backgroundColor:"rgba(124,58,237,.15)",borderColor:"#7C3AED",pointBackgroundColor:"#7C3AED",borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,scales:{r:{beginAtZero:true,max:100,ticks:{display:false},grid:{color:"#e2e8f0"},pointLabels:{font:{size:11}}}},plugins:{legend:{display:false}}}});
  // Trend
  new Chart(document.getElementById("trendChart"),{type:"line",data:{labels:trendData.map(d=>d.m),datasets:[{data:trendData.map(d=>d.s),borderColor:"#7C3AED",backgroundColor:"rgba(124,58,237,.08)",fill:true,tension:.4,borderWidth:2,pointRadius:3,pointBackgroundColor:"#7C3AED"}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,max:100,grid:{color:"#f1f5f9"},ticks:{font:{size:10}}},x:{grid:{display:false},ticks:{font:{size:10}}}},plugins:{legend:{display:false}}}});
}

async function genSummary(id){
  const c=state.companies.find(x=>x.id===id);if(!c)return;
  const btn=document.getElementById("aiSumBtn");const out=document.getElementById("aiSumOut");
  btn.disabled=true;btn.textContent="Generating…";out.innerHTML='<div style="margin-top:16px"><span class="spinner"></span> Analyzing account…</div>';
  const text=await callClaude("You are a customer success strategist. Write a concise executive summary for this account. Cover: situation, key risks, opportunities, recommended actions. 3–4 paragraphs, no headers, no bullets.\n\n"+ctxFor(c));
  out.innerHTML=`<div class="ai-output">${esc(text)}</div>`;btn.textContent="Regenerate";btn.disabled=false;
}

/* ═══ HEALTH MODEL ═══ */
function renderModel(el){
  el.innerHTML=`
    <div class="page-header"><div><h1>Health Score Model</h1><p class="sub">How Pulse calculates health — and why silence matters.</p></div></div>
    <div class="hm-callout">
      <h3>The curveball: silence as a signal</h3>
      <p>Most health tools only score what's present. Pulse also scores what's absent. An account that logged in daily and suddenly goes quiet is a different risk profile than one that's always been low-usage. That silence is often the loudest pre-churn signal.</p>
      <p style="margin-top:8px">Pulse scores <strong>rate of change vs. the account's own baseline</strong> as a first-class health component.</p>
    </div>
    <div class="threshold-row">
      ${[{l:"Healthy",r:"70–100",c:"var(--emerald)",bg:"#ecfdf5",b:"#d1fae5"},{l:"Monitor",r:"40–69",c:"var(--amber)",bg:"#fffbeb",b:"#fef3c7"},{l:"At Risk",r:"0–39",c:"var(--rose)",bg:"#fef2f2",b:"#fecaca"}].map(t=>`<div class="threshold" style="background:${t.bg};border-color:${t.b}"><div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span style="width:10px;height:10px;border-radius:50%;background:${t.c}"></span><span style="font-size:13px;font-weight:600;color:${t.c}">${t.l}</span></div><div style="font-size:20px;font-weight:700">${t.r}</div></div>`).join("")}
    </div>
    <div class="card" style="margin-bottom:20px"><h3 style="font-size:14px;font-weight:600;margin-bottom:20px">Component Weights</h3>
      ${WEIGHTS.map(w=>`<div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;font-weight:600">${w.c}</span><span style="font-size:13px;font-weight:700;color:${w.color}">${w.w}%</span></div><div style="font-size:11px;color:var(--s500);margin:2px 0 4px">${w.d}</div><div class="weight-bar"><div class="weight-fill" style="width:${w.w}%;background:${w.color}"></div></div></div>`).join("")}
    </div>`;
}

/* ═══ AGENTS ═══ */
function renderAgents(el){
  const opts=state.companies.map(c=>`<option value="${c.id}" ${c.id===(state._agentAcct||1)?"selected":""}>${c.n} (${c.hs})</option>`).join("");
  const actions=[{id:"save",l:"Draft save plan",d:"Rescue strategy for an at-risk account"},{id:"expand",l:"Expansion plays",d:"Identify upsell and cross-sell opportunities"},{id:"qbr",l:"QBR prep",d:"Executive summary and talk track for a QBR"},{id:"email",l:"Draft outreach",d:"Personalized re-engagement email"}];

  el.innerHTML=`
    <div class="page-header">
      <div><h1>Agents</h1><p class="sub">AI-powered assistants for your accounts.</p></div>
      <select onchange="state._agentAcct=+this.value">${opts}</select>
    </div>
    <div class="detail-grid">
      <div class="card"><h3 style="font-size:14px;font-weight:600;margin-bottom:12px">Executive Summary</h3>
        <button class="ai-btn" id="execBtn" onclick="runExec()">Generate Executive Brief</button>
        <div id="execOut"></div>
      </div>
      <div class="card"><h3 style="font-size:14px;font-weight:600;margin-bottom:12px">CS Agent</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">${actions.map(a=>`<button class="seg" style="text-align:left;padding:10px;font-size:12px" onclick="runAgent('${a.id}','${a.l}','${a.d}')""><strong>${a.l}</strong></button>`).join("")}</div>
        <div id="agentOut"></div>
      </div>
    </div>`;
}
async function runExec(){
  const c=state.companies.find(x=>x.id===(state._agentAcct||1));if(!c)return;
  const btn=document.getElementById("execBtn");const out=document.getElementById("execOut");
  btn.disabled=true;btn.textContent="Generating…";out.innerHTML='<div style="margin-top:16px"><span class="spinner"></span></div>';
  const text=await callClaude("You are a customer success executive advisor. Generate a strategic executive briefing. Cover: situation, risks, opportunities, recommended actions. 4–5 paragraphs. No headers, no bullets.\n\n"+ctxFor(c));
  out.innerHTML=`<div class="ai-output">${esc(text)}</div>`;btn.textContent="Regenerate";btn.disabled=false;
}
async function runAgent(id,label,desc){
  const c=state.companies.find(x=>x.id===(state._agentAcct||1));if(!c)return;
  const out=document.getElementById("agentOut");
  out.innerHTML='<div style="margin-top:12px"><span class="spinner"></span> Working on '+esc(label)+'…</div>';
  const text=await callClaude(`You are a senior CS AI assistant. Help with: "${label}" — ${desc}. Be specific and actionable. 3–5 paragraphs. No headers, no bullets.\n\n`+ctxFor(c));
  out.innerHTML=`<div class="ai-output">${esc(text)}</div>`;
}

/* ═══ INIT ═══ */
render();
</script>
</body>
</html>
