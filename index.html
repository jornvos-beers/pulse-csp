// Nav
const navItems=[{id:"dashboard",label:"Portfolio",icon:"📊"},{id:"model",label:"Health Model",icon:"💡"},{id:"agents",label:"Agents",icon:"⚡"}];
function renderNav(){document.getElementById("nav").innerHTML=navItems.map(it=>`<button class="${state.view===it.id||(state.view==="detail"&&it.id==="dashboard")?"active":""}" onclick="nav('${it.id}')">${it.icon} <span>${it.label}</span></button>`).join("");}
function nav(v){state.view=v;if(v!=="detail")state.selectedId=null;render();}
function selectAcct(id){state.selectedId=id;state.view="detail";render();}
function render(){renderNav();const a=document.getElementById("app");if(state.view==="dashboard")renderDash(a);else if(state.view==="detail")renderDetail(a);else if(state.view==="model")renderModel(a);else if(state.view==="agents")renderAgents(a);}

function renderDash(el){
  const pool=state.owner==="all"?state.companies:state.companies.filter(c=>c.csmId===state.owner);
  const filtered=pool.filter(c=>{
    const q=state.search.toLowerCase();if(q&&!c.n.toLowerCase().includes(q)&&!c.tier.toLowerCase().includes(q))return false;
    if(state.segment==="at-risk")return st(c.hs)==="at-risk";if(state.segment==="customer")return c.st==="customer";
    if(state.segment==="prospect")return c.st==="prospect";if(state.segment==="silent")return c.sig.includes("silence");return true;
  });
  const tArr=pool.reduce((s,c)=>s+c.arr,0);const avgH=pool.length?Math.round(pool.reduce((s,c)=>s+c.hs,0)/pool.length):0;
  const risk=pool.filter(c=>st(c.hs)==="at-risk").length;const ownerName=state.owner==="all"?"Team":TEAM.find(t=>t.id===state.owner)?.name||"";
  const urgent=pool.filter(c=>c.sig.length||st(c.hs)==="at-risk").sort((a,b)=>a.hs-b.hs).slice(0,3);
  const segs=[{id:"all",l:"All"},{id:"at-risk",l:"At Risk"},{id:"customer",l:"Customers"},{id:"prospect",l:"Prospects"},{id:"silent",l:"Silent"}];
  const opts=TEAM.map(t=>`<option value="${t.id}" ${state.owner===t.id?"selected":""}>${t.name}</option>`).join("");
  const sigHtml=(sig)=>sig.map(s=>{const cfg=SIG[s]||{l:s,c:"#94a3b8"};return`<span class="signal-tag" style="background:${cfg.c}14;color:${cfg.c}">${cfg.l}</span>`;}).join("");

  el.innerHTML=`
    <div class="ph-banner">
      <div class="icon">🗄️</div>
      <div style="flex:1"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:14px;font-weight:600">Connected to Planhat</span><span class="live"><span class="dot"></span>Live</span></div><div style="font-size:11px;color:var(--s500);margin-top:2px">${pool.length} accounts from Planhat demo instance</div></div>
    </div>
    <div class="page-header">
      <div><h1>${esc(ownerName)} Portfolio</h1><p class="sub">${pool.length} accounts · ${fmt(tArr)} ARR</p></div>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="text" placeholder="Search…" value="${esc(state.search)}" oninput="state.search=this.value;render()" style="width:180px">
        <select onchange="state.owner=this.value;render()"><option value="all">All team</option>${opts}</select>
      </div>
    </div>
    <div class="kpi-row">
      <div class="card kpi"><div class="label">Total ARR</div><div class="value">${fmt(tArr)}</div><div class="sub">${pool.filter(c=>c.st==="customer").length} paying accounts</div></div>
      <div class="card kpi"><div class="label">Avg Health</div><div class="value" style="color:${avgH>=70?"var(--emerald)":avgH>=40?"var(--amber)":"var(--rose)"}">${avgH}<span style="font-size:14px;font-weight:400;color:var(--s400)">/100</span></div></div>
      <div class="card kpi"><div class="label">At Risk</div><div class="value" style="color:var(--rose)">${risk}</div><div class="sub">${fmt(pool.filter(c=>st(c.hs)==="at-risk").reduce((s,c)=>s+c.arr,0))} ARR exposed</div></div>
      <div class="card kpi"><div class="label">Healthy</div><div class="value" style="color:var(--emerald)">${pool.filter(c=>st(c.hs)==="healthy").length}</div><div class="sub">${fmt(pool.filter(c=>st(c.hs)==="healthy").reduce((s,c)=>s+c.arr,0))} ARR</div></div>
    </div>
    ${urgent.length?`<div style="margin-bottom:24px"><h3 style="font-size:13px;font-weight:700;color:var(--s500);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">⚠ Priority Actions</h3>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">${urgent.map(c=>{const s=st(c.hs);return`<div class="card priority-card" onclick="selectAcct(${c.id})">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><div class="acct-ini" style="background:${c.col};width:28px;height:28px;font-size:10px">${ini(c.n)}</div><span class="acct-name" style="font-size:13px">${esc(c.n)}</span><span class="badge ${s}" style="margin-left:auto;font-size:10px"><span class="badge-dot"></span>${c.hs}</span></div>
      <div style="font-size:11px;color:var(--s500);margin-bottom:6px">${c.tier} · ${fmt(c.arr)} ARR${c.rd?" · Renewal in "+c.rd+"d":""}</div>
      <div>${sigHtml(c.sig)}</div>
    </div>`;}).join("")}</div></div>`:""}
    <div class="filters">${segs.map(s=>{const cnt=s.id==="all"?pool.length:pool.filter(c=>s.id==="at-risk"?st(c.hs)==="at-risk":s.id==="customer"?c.st==="customer":s.id==="prospect"?c.st==="prospect":c.sig.includes("silence")).length;return`<button class="seg ${state.segment===s.id?"active":""}" onclick="state.segment='${s.id}';render()">${s.l} <span style="opacity:.6">${cnt}</span></button>`;}).join("")}</div>
    <div style="font-size:11px;color:var(--s400);margin-bottom:8px">Showing ${filtered.length} of ${pool.length} accounts</div>
    <div class="card" style="padding:0;overflow-x:auto">
      <table class="acct-table"><thead><tr><th>Account</th><th>Health</th><th>ARR</th><th>Tier</th><th>Phase</th><th>CSM</th><th>Signals</th><th>Renewal</th></tr></thead>
      <tbody>${filtered.sort((a,b)=>a.hs-b.hs).map(c=>{const s=st(c.hs);const d=c.hs-c.prev;
        return`<tr onclick="selectAcct(${c.id})">
          <td><div style="display:flex;align-items:center;gap:10px"><div class="acct-ini" style="background:${c.col}">${ini(c.n)}</div><span class="acct-name">${esc(c.n)}</span></div></td>
          <td><span class="hs-num" style="color:${s==="healthy"?"var(--emerald)":s==="monitor"?"var(--amber)":"var(--rose)"}">${c.hs}</span><span class="hs-delta ${d>=0?"up":"down"}">${d>=0?"▲":"▼"}${Math.abs(d)}</span></td>
          <td style="font-weight:600">${fmt(c.arr)}</td>
          <td><span class="badge ${s}"><span class="badge-dot"></span>${c.tier}</span></td>
          <td style="font-size:12px;color:var(--s500)">${c.ph}</td>
          <td style="font-size:12px">${esc(c.csm)}</td>
          <td>${sigHtml(c.sig)||'<span style="color:var(--s300)">—</span>'}</td>
          <td style="font-size:12px;color:var(--s500)">${c.ren||"—"}</td>
        </tr>`;}).join("")}</tbody></table>
    </div>`;
}

function renderDetail(el){
  const c=state.companies.find(x=>x.id===state.selectedId);if(!c){nav("dashboard");return;}
  const s=st(c.hs);const d=c.hs-c.prev;
  const hbL=["Usage","Engagement","Support","Sentiment","Momentum"],hbK=["U","E","Su","Se","M"],hbV=hbK.map(k=>c.hb[k]);
  const trend=[{m:"Jan",s:Math.max(0,c.hs-12)},{m:"Feb",s:Math.max(0,c.hs-8)},{m:"Mar",s:Math.max(0,c.hs-5)},{m:"Apr",s:Math.max(0,c.hs-3)},{m:"May",s:Math.max(0,c.hs-1)},{m:"Jun",s:c.hs}];
  const contactsHtml=c.contacts.length?c.contacts.map(ct=>`<div class="contact-row"><div class="contact-avatar">${ini(ct.n)}</div><div style="flex:1"><div style="font-size:13px;font-weight:600">${esc(ct.n)}</div><div style="font-size:11px;color:var(--s500)">${esc(ct.p)}</div></div><a href="mailto:${esc(ct.e)}" style="font-size:11px;color:var(--v600);text-decoration:none" onclick="event.stopPropagation()">✉ Email</a></div>`).join(""):'<div style="font-size:12px;color:var(--s400);padding:12px 0">No contacts synced from Planhat</div>';

  el.innerHTML=`
    <div class="detail-header">
      <button class="back-btn" onclick="nav('dashboard')">←</button>
      <div class="acct-ini" style="background:${c.col};width:44px;height:44px;font-size:16px">${ini(c.n)}</div>
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><h1 style="font-size:22px;font-weight:800">${esc(c.n)}</h1><span class="badge ${s}"><span class="badge-dot"></span>${s.replace("-"," ")}</span><span style="font-size:11px;color:var(--v600);background:var(--v50);padding:2px 8px;border-radius:6px;font-weight:600;border:1px solid var(--v200)">Planhat</span></div>
        <div style="font-size:13px;color:var(--s500);margin-top:3px">${c.tier} · ${c.ph} · ${esc(c.csm)} · CSM Score ${c.cs}/5</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px">
      <div class="card kpi">
        <div class="label">Health</div>
        <div style="display:flex;align-items:center;gap:6px"><input class="override-input" type="number" min="0" max="100" value="${c.hs}" onchange="overrideHS(${c.id},+this.value)" style="color:${s==="healthy"?"var(--emerald)":s==="monitor"?"var(--amber)":"var(--rose)"}"><span class="hs-delta ${d>=0?"up":"down"}">${d>=0?"▲":"▼"}${Math.abs(d)}</span></div>
        <div class="sub" style="margin-top:4px">Click to override</div>
      </div>
      <div class="card kpi"><div class="label">ARR</div><div class="value" style="font-size:24px">${fmt(c.arr)}</div></div>
      <div class="card kpi"><div class="label">CSM Score</div><div class="value" style="font-size:24px">${c.cs}/5</div><div class="sub">Gut-feel rating</div></div>
      <div class="card kpi"><div class="label">Renewal</div><div class="value" style="font-size:16px">${c.ren||"—"}</div><div class="sub">${c.rd?c.rd+" days":"No date"}</div></div>
      <div class="card kpi"><div class="label">Signals</div><div style="margin-top:6px">${c.sig.map(sg=>{const cfg=SIG[sg]||{l:sg,c:"#94a3b8"};return`<span class="signal-tag" style="background:${cfg.c}14;color:${cfg.c};margin-bottom:3px">${cfg.l}</span>`;}).join("")||'<span style="color:var(--s300);font-size:12px">None</span>'}</div></div>
    </div>
    <div class="detail-grid">
      <div class="card"><h3 style="font-size:14px;font-weight:700;margin-bottom:16px">Health Breakdown</h3><canvas id="radarC" height="220"></canvas></div>
      <div class="card"><h3 style="font-size:14px;font-weight:700;margin-bottom:16px">Health Trend</h3><canvas id="trendC" height="220"></canvas></div>
    </div>
    <div class="detail-grid">
      <div class="card"><h3 style="font-size:14px;font-weight:700;margin-bottom:12px">Contacts</h3>${contactsHtml}</div>
      <div class="card"><h3 style="font-size:14px;font-weight:700;margin-bottom:12px">AI Account Summary</h3>
        <button class="ai-btn" id="aiBtn" onclick="genSum(${c.id})">Generate Summary</button><div id="aiOut"></div>
      </div>
    </div>`;
  new Chart(document.getElementById("radarC"),{type:"radar",data:{labels:hbL,datasets:[{data:hbV,backgroundColor:"rgba(124,58,237,.12)",borderColor:"#7C3AED",pointBackgroundColor:"#7C3AED",borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,scales:{r:{beginAtZero:true,max:100,ticks:{display:false},grid:{color:"#e2e8f0"},pointLabels:{font:{size:11,weight:"600"}}}},plugins:{legend:{display:false}}}});
  new Chart(document.getElementById("trendC"),{type:"line",data:{labels:trend.map(d=>d.m),datasets:[{data:trend.map(d=>d.s),borderColor:"#7C3AED",backgroundColor:"rgba(124,58,237,.06)",fill:true,tension:.4,borderWidth:2.5,pointRadius:4,pointBackgroundColor:"#7C3AED"}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,max:100,grid:{color:"#f1f5f9"},ticks:{font:{size:10}}},x:{grid:{display:false},ticks:{font:{size:10}}}},plugins:{legend:{display:false}}}});
}
function overrideHS(id,val){const c=state.companies.find(x=>x.id===id);if(c){c.prev=c.hs;c.hs=Math.max(0,Math.min(100,val));render();}}
async function genSum(id){
  const c=state.companies.find(x=>x.id===id);if(!c)return;
  const b=document.getElementById("aiBtn"),o=document.getElementById("aiOut");
  b.disabled=true;b.textContent="Generating…";o.innerHTML='<div style="margin-top:16px"><span class="spinner"></span> Analyzing…</div>';
  const t=await callClaude("You are a customer success strategist. Write a concise executive summary. Cover: situation, risks, opportunities, actions. 3-4 paragraphs, no headers, no bullets.\n\n"+ctx(c));
  o.innerHTML=`<div class="ai-output">${esc(t)}</div>`;b.textContent="Regenerate";b.disabled=false;
}

function renderModel(el){
  el.innerHTML=`
    <div class="page-header"><div><h1>Health Score Model</h1><p class="sub">How Pulse calculates health — and why silence matters.</p></div></div>
    <div class="hm-callout"><h3>The curveball: silence as a signal</h3><p>Most health tools only score what's present. Pulse also scores what's absent. An account that logged in daily and suddenly goes quiet is a different risk profile than one that's always been low-usage. That silence is often the loudest pre-churn signal.</p><p style="margin-top:8px">Pulse scores <strong>rate of change vs. the account's own baseline</strong> as a first-class health component.</p></div>
    <div class="threshold-row">
      ${[{l:"Healthy",r:"70–100",c:"var(--emerald)",bg:"#ecfdf5",b:"#a7f3d0"},{l:"Monitor",r:"40–69",c:"var(--amber)",bg:"#fffbeb",b:"#fde68a"},{l:"At Risk",r:"0–39",c:"var(--rose)",bg:"#fef2f2",b:"#fecaca"}].map(t=>`<div class="threshold" style="background:${t.bg};border-color:${t.b}"><div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span style="width:10px;height:10px;border-radius:50%;background:${t.c}"></span><span style="font-size:13px;font-weight:700;color:${t.c}">${t.l}</span></div><div style="font-size:22px;font-weight:800">${t.r}</div></div>`).join("")}
    </div>
    <div class="card"><h3 style="font-size:15px;font-weight:700;margin-bottom:20px">Component Weights</h3>
      ${WEIGHTS.map(w=>`<div style="margin-bottom:18px"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;font-weight:700">${w.c}</span><span style="font-size:14px;font-weight:800;color:${w.color}">${w.w}%</span></div><div style="font-size:11px;color:var(--s500);margin:3px 0 5px">${w.d}</div><div class="weight-bar"><div class="weight-fill" style="width:${w.w}%;background:${w.color}"></div></div></div>`).join("")}
    </div>`;
}

function renderAgents(el){
  const opts=state.companies.map(c=>`<option value="${c.id}" ${c.id===state._agentAcct?"selected":""}>${c.n} (${c.hs})</option>`).join("");
  const actions=[{id:"save",l:"Draft save plan",d:"Rescue strategy for an at-risk account"},{id:"expand",l:"Expansion plays",d:"Identify upsell and cross-sell opportunities"},{id:"qbr",l:"QBR prep",d:"Executive summary and talk track"},{id:"email",l:"Draft outreach",d:"Personalized re-engagement email"}];
  el.innerHTML=`
    <div class="page-header"><div><h1>Agents</h1><p class="sub">AI-powered assistants for customer success.</p></div>
      <select onchange="state._agentAcct=+this.value">${opts}</select></div>
    <div class="detail-grid">
      <div class="card"><h3 style="font-size:14px;font-weight:700;margin-bottom:12px">Executive Summary</h3>
        <button class="ai-btn" id="execBtn" onclick="runExec()">Generate Executive Brief</button><div id="execOut"></div></div>
      <div class="card"><h3 style="font-size:14px;font-weight:700;margin-bottom:12px">CS Agent</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">${actions.map(a=>`<button class="seg" style="text-align:left;padding:10px 12px" onclick="runAgent('${a.id}','${esc(a.l)}','${esc(a.d)}')"><strong style="font-size:12px">${a.l}</strong><div style="font-size:10px;color:var(--s400);margin-top:2px">${a.d}</div></button>`).join("")}</div>
        <div id="agentOut"></div></div>
    </div>`;
}
async function runExec(){const c=state.companies.find(x=>x.id===state._agentAcct);if(!c)return;const b=document.getElementById("execBtn"),o=document.getElementById("execOut");b.disabled=true;b.textContent="Generating…";o.innerHTML='<div style="margin-top:16px"><span class="spinner"></span></div>';const t=await callClaude("You are a customer success executive advisor. Generate a strategic executive briefing. Cover: situation, risks, opportunities, recommended actions. 4-5 paragraphs, no headers, no bullets.\n\n"+ctx(c));o.innerHTML=`<div class="ai-output">${esc(t)}</div>`;b.textContent="Regenerate";b.disabled=false;}
async function runAgent(id,label,desc){const c=state.companies.find(x=>x.id===state._agentAcct);if(!c)return;const o=document.getElementById("agentOut");o.innerHTML=`<div style="margin-top:12px"><span class="spinner"></span> Working on ${label}…</div>`;const t=await callClaude(`You are a senior CS AI assistant. Task: "${label}" — ${desc}. Be specific and actionable. 3-5 paragraphs, no headers, no bullets.\n\n`+ctx(c));o.innerHTML=`<div class="ai-output">${esc(t)}</div>`;}

render();
</script>
</body>
</html>
