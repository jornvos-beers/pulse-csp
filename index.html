.sidebar{width:232px;min-width:232px;background:var(--s900);color:#fff;display:flex;flex-direction:column;height:100vh}
.sidebar-logo{padding:24px 20px;display:flex;align-items:center;gap:10px}
.sidebar-logo .icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--v500),var(--v700));display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 8px rgba(124,58,237,.4)}
.sidebar-logo span{font-size:19px;font-weight:800;letter-spacing:-.5px}
.sidebar nav{flex:1;padding:0 12px;margin-top:4px}
.sidebar nav button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;border:none;font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:2px;color:var(--s400);background:transparent;text-align:left;transition:all .15s}
.sidebar nav button:hover{background:var(--s800);color:var(--s300)}
.sidebar nav button.active{background:var(--v600);color:#fff;box-shadow:0 2px 8px rgba(124,58,237,.3)}
.sidebar-source{margin:0 12px 12px;padding:12px 14px;border-radius:10px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.15)}
.sidebar-source .label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--emerald)}
.sidebar-source .sub{font-size:10px;color:var(--s500);margin-top:3px;margin-left:18px}
.sidebar-user{padding:16px 20px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:12px}
.sidebar-user .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--v500),var(--v700));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.sidebar-user .name{font-size:13px;font-weight:600}
.sidebar-user .role{font-size:11px;color:var(--s500)}
.main{flex:1;overflow-y:auto;padding:32px}
.main-inner{max-width:1180px;margin:0 auto}
.card{background:#fff;border:1px solid var(--s200);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.kpi{padding:18px 20px}.kpi .label{font-size:11px;color:var(--s500);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi .value{font-size:28px;font-weight:800;letter-spacing:-.5px}.kpi .sub{font-size:11px;color:var(--s400);margin-top:4px}
.filters{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.seg{padding:6px 14px;border-radius:8px;border:1px solid var(--s200);font-size:12.5px;font-weight:500;cursor:pointer;background:#fff;color:var(--s600);transition:all .15s}
.seg.active{background:var(--v600);color:#fff;border-color:var(--v600)}
.seg:hover:not(.active){border-color:var(--v400);color:var(--v700)}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.page-header h1{font-size:22px;font-weight:800;letter-spacing:-.3px}.page-header .sub{font-size:13px;color:var(--s500);margin-top:2px}
select,input[type=text]{font-size:13px;border:1px solid var(--s200);border-radius:8px;padding:8px 12px;background:#fff;outline:none;transition:border .15s}
select:focus,input[type=text]:focus{border-color:var(--v500);box-shadow:0 0 0 3px var(--v100)}
.acct-table{width:100%;border-collapse:collapse}
.acct-table th{text-align:left;font-size:10.5px;font-weight:700;color:var(--s400);text-transform:uppercase;letter-spacing:.6px;padding:10px 12px;border-bottom:2px solid var(--s200)}
.acct-table td{padding:12px;border-bottom:1px solid var(--s100);font-size:13px;vertical-align:middle}
.acct-table tr{cursor:pointer;transition:background .1s}
.acct-table tr:hover td{background:var(--v50)}
.acct-ini{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff;flex-shrink:0}
.acct-name{font-weight:600;color:var(--s900)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}
.badge.healthy{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.badge.monitor{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
.badge.at-risk{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.badge-dot{width:6px;height:6px;border-radius:50%}
.badge.healthy .badge-dot{background:var(--emerald)}.badge.monitor .badge-dot{background:var(--amber)}.badge.at-risk .badge-dot{background:var(--rose)}
.signal-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;margin-right:3px;margin-bottom:2px}
.hs-num{font-weight:800;font-size:14px}.hs-delta{font-size:10px;margin-left:4px;font-weight:600}
.hs-delta.up{color:var(--emerald)}.hs-delta.down{color:var(--rose)}

.ph-banner .icon{width:34px;height:34px;border-radius:10px;background:rgba(16,185,129,.1);color:var(--emerald);display:flex;align-items:center;justify-content:center;font-size:16px}
.ph-banner .live{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.ph-banner .live .dot{width:6px;height:6px;border-radius:50%;background:var(--emerald);animation:pulse 2s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.priority-card{border-left:3px solid var(--rose);cursor:pointer;transition:all .15s;padding:14px 16px}
.priority-card:hover{border-color:var(--v600);box-shadow:0 4px 12px rgba(124,58,237,.1)}

.back-btn:hover{border-color:var(--v400);background:var(--v50)}

.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.ai-btn{padding:10px 20px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--v600),var(--v700));color:#fff;width:100%;transition:opacity .15s}
.ai-btn:hover{opacity:.9}.ai-btn:disabled{opacity:.5;cursor:wait}

.hm-callout h3{font-size:15px;font-weight:700;color:var(--v900);margin-bottom:6px}
.hm-callout p{font-size:13px;color:#5b21b6;line-height:1.65}

.weight-fill{height:100%;border-radius:5px;transition:width .6s ease}
.threshold-row{display:flex;gap:12px;margin-bottom:24px}
.threshold{flex:1;padding:16px;border-radius:10px;border:1px solid}

.override-input:focus{border-color:var(--v500);box-shadow:0 0 0 3px var(--v100)}
@keyframes spin{to{transform:rotate(360deg)}}

  .main{padding:16px}
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .detail-grid{grid-template-columns:1fr}

@media(max-width:600px){
  .sidebar{display:none}
  .kpi-row{grid-template-columns:1fr 1fr}
  .page-header{flex-direction:column;align-items:flex-start;gap:12px}
}

async function genSum(id){

async function askPulse(){
  const input=document.getElementById("chatInput");const q=input.value.trim();if(!q)return;
  const out=document.getElementById("chatOut");
  out.innerHTML='<div class="card" style="margin-top:8px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><div style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--v500),var(--v700));display:flex;align-items:center;justify-content:center;font-size:12px">⚡</div><span style="font-size:13px;font-weight:600;color:var(--v700)">Pulse AI</span><span class="spinner" style="margin-left:auto"></span></div><div style="font-size:13px;color:var(--s400)">Analyzing your portfolio...</div></div>';
  const portfolio=state.companies.map(c=>`${c.n}: health ${c.hs}/100, ARR ${fmt(c.arr)}, ${c.st}, phase ${c.ph}, CSM ${c.csm}, signals: ${c.sig.join(",")||"none"}, renewal: ${c.ren||"N/A"}`).join("\n");
  const t=await callClaude(`You are Pulse AI, a customer success copilot. The CSM asks: "${q}"\n\nHere is their full portfolio:\n${portfolio}\n\nGive a specific, actionable answer based on the data. Reference account names, ARR figures, and health scores. Be concise — 3-5 paragraphs, no headers, no bullets.`);
  out.innerHTML=`<div class="card" style="margin-top:8px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><div style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--v500),var(--v700));display:flex;align-items:center;justify-content:center;font-size:12px">⚡</div><span style="font-size:13px;font-weight:600;color:var(--v700)">Pulse AI</span></div><div class="ai-output" style="border-top:none;padding-top:0;margin-top:0">${esc(t)}</div></div>`;
  input.value="";
}
